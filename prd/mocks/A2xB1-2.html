<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完成ライン合意シート（A2xB1-2）</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2933; --sub: #667085;
  --line: #d9dee5; --accent: #2563eb; --accent-bg: #e8f0fe;
  --ok: #15803d; --ok-bg: #e3f6ea; --warn: #b45309; --warn-bg: #fdf1dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --card: #1e232b; --text: #e6e9ee; --sub: #9aa4b2;
    --line: #333a45; --accent: #6ea0ff; --accent-bg: #223052;
    --ok: #5fd08a; --ok-bg: #173424; --warn: #f0b35a; --warn-bg: #3a2c14;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
.wrap { max-width: 420px; margin: 0 auto; padding: 0 16px 40px; }
header { padding: 14px 0 8px; }
header h1 { font-size: 16px; margin: 0; }
header small { color: var(--sub); }
.card { background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px; margin: 12px 0; }
.card h2 { font-size: 14px; margin: 0 0 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .4; cursor: default; }
.roles button { flex: 1; }
.label { font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
.hint { font-size: 12px; color: var(--sub); }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px;
  background: var(--accent-bg); color: var(--accent); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
select, input, textarea { font: inherit; width: 100%; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 4px 0; border-bottom: 1px solid var(--line); }
td:first-child { color: var(--sub); width: 40%; }
.diff { color: var(--warn); font-weight: 600; }
.diffmark { color: var(--warn); }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 8px;
  padding: 8px; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>資料の完成ライン合意シート</h1>
    <small>A2xB1-2 / 依頼の前に「誰に・何枚・どの粗さで」を合意する</small>
  </header>

  <div class="card">
    <div class="row roles" id="roles"></div>
    <div class="row" style="margin-top:8px">
      <button id="sample">サンプルを読み込む</button>
      <button id="reset">最初から</button>
    </div>
    <div class="hint" id="roleHint" style="margin-top:6px"></div>
  </div>

  <div id="app"></div>

  <div class="card">
    <h2>モックで確かめること</h2>
    <div id="lab" class="hint"></div>
  </div>
</div>

<script>
const AUDIENCE = ['課内', '部長', '他部署', '顧客'];
const PAGES = ['1〜3枚', '4〜6枚', '7〜10枚', '11枚以上'];
const ROUGH = [
  { name: 'メモ書き', hours: 0.5, label: '30分' },
  { name: 'たたき台', hours: 2, label: '2時間' },
  { name: '清書', hours: 8, label: '1日（8時間）' }
];
const REFS = ['なし', '先月の部長報告（3枚）', '基板評価の記録（10枚）', '顧客向け仕様書（15枚）'];
const DATES = ['明日', '今週金曜', '来週月曜（部長報告）', '来週金曜'];

const initial = () => ({
  role: 'boss', title: '', audience: null, pages: null, rough: null, date: null,
  ref: 'なし', from: null, status: 'draft', diffItems: [], diffNote: '',
  actual: '', startedAt: null, selectSec: null, roughLog: []
});
let S = initial();
const $ = id => document.getElementById(id);
const roleName = r => (r === 'boss' ? '課長（依頼者）' : 'Bさん（作成者）');
const complete = () => S.audience && S.pages && S.rough !== null && S.date;

function pick(key, value) {
  if (S.startedAt === null) S.startedAt = Date.now();
  if (key === 'rough' && S.rough !== null && S.rough !== value) {
    S.roughLog.push({ by: S.role, from: ROUGH[S.rough].name, to: ROUGH[value].name });
  }
  S[key] = value;
  render();
}

function chips(key, list) {
  return '<div class="row">' + list.map((v, i) => {
    const val = key === 'rough' ? i : v;
    const on = S[key] === val ? ' on' : '';
    const text = key === 'rough' ? `${v.name}（${v.label}）` : v;
    return `<button class="${on}" data-k="${key}" data-v="${val}" ${S.status !== 'draft' ? 'disabled' : ''}>${text}</button>`;
  }).join('') + '</div>';
}

function sheetView() {
  const dis = S.status !== 'draft';
  let h = '<div class="card"><h2>1. 完成ラインの4項目';
  h += S.status === 'draft' ? '' : ' <span class="tag">送信済み</span>';
  h += '</h2>';
  h += '<div class="label">資料の件名</div>';
  h += `<input id="title" value="${S.title}" placeholder="例：評価結果のまとめ" ${dis ? 'disabled' : ''}>`;
  h += '<div class="label">誰に見せる</div>' + chips('audience', AUDIENCE);
  h += '<div class="label">枚数の目安</div>' + chips('pages', PAGES);
  h += '<div class="label">粗さ（作成時間の目安つき）</div>' + chips('rough', ROUGH);
  if (S.rough !== null) {
    const r = ROUGH[S.rough];
    h += `<div class="note">この粗さで頼むと、作成者は約 ${r.label} をこの資料に使います。</div>`;
  }
  h += '<div class="label">使う日</div>' + chips('date', DATES);
  h += '<div class="label">参考資料（「これと同じくらい」）</div>';
  h += `<select id="ref" ${dis ? 'disabled' : ''}>` +
    REFS.map(r => `<option ${r === S.ref ? 'selected' : ''}>${r}</option>`).join('') + '</select>';
  if (S.status === 'draft') {
    h += `<div class="row" style="margin-top:12px"><button class="primary" id="send" ${complete() ? '' : 'disabled'}>`;
    h += S.role === 'worker' ? 'この内容で確認を求める' : 'この内容で依頼する';
    h += '</button></div>';
  }
  return h + '</div>';
}

function summaryTable(markDiff) {
  const d = markDiff ? S.diffItems : [];
  const mark = k => (d.includes(k) ? ' <span class="diffmark">← 違う</span>' : '');
  return '<table>' +
    `<tr><td>件名</td><td>${S.title || '（未入力）'}</td></tr>` +
    `<tr><td>誰に</td><td>${S.audience}${mark('誰に')}</td></tr>` +
    `<tr><td>枚数</td><td>${S.pages}${mark('枚数')}</td></tr>` +
    `<tr><td>粗さ</td><td>${ROUGH[S.rough].name}（約${ROUGH[S.rough].label}）${mark('粗さ')}</td></tr>` +
    `<tr><td>使う日</td><td>${S.date}${mark('使う日')}</td></tr>` +
    `<tr><td>参考資料</td><td>${S.ref}</td></tr></table>`;
}

function confirmView() {
  if (S.status === 'draft') return '';
  let h = '<div class="card"><h2>2. 確認 ';
  const tags = { sent: ['確認待ち', ''], agreed: ['合意', 'ok'], revise: ['ここが違う', 'warn'] };
  h += `<span class="tag ${tags[S.status][1]}">${tags[S.status][0]}</span></h2>`;
  h += `<div class="hint">${roleName(S.from)}が送りました</div>` + summaryTable(S.status === 'revise');
  if (S.status === 'revise' && S.diffNote) h += `<div class="note">${S.diffNote}</div>`;
  const mine = S.role !== S.from;
  if (S.status === 'sent' && mine) {
    h += '<div class="label">違う項目があれば選んでください（1タップで「このとおり」も可）</div>';
    h += '<div class="row">' + ['誰に', '枚数', '粗さ', '使う日'].map(k =>
      `<button data-diff="${k}" class="${S.diffItems.includes(k) ? 'on' : ''}">${k}</button>`).join('') + '</div>';
    h += '<input id="diffNote" placeholder="ひとこと（任意）" style="margin-top:8px">';
    h += '<div class="row" style="margin-top:8px"><button class="primary" id="ok">このとおり</button>';
    h += '<button id="ng">ここが違う</button></div>';
  } else if (S.status === 'sent') {
    h += '<div class="hint" style="margin-top:8px">相手の返事を待っています。上のタブで相手に切り替えて試せます。</div>';
  }
  if (S.status === 'revise') {
    h += '<div class="row" style="margin-top:8px"><button id="edit">シートを直して送り直す</button></div>';
  }
  return h + '</div>';
}

function retroView() {
  if (S.status !== 'agreed') return '';
  const exp = ROUGH[S.rough].hours;
  let h = '<div class="card"><h2>3. 作成時間の振り返り</h2>';
  h += '<div class="hint">この記録は、依頼者と作成者の2人だけが見ます。評価には使いません。</div>';
  h += '<div class="label">提出時に実際にかかった時間（時間）</div>';
  h += `<div class="row"><input id="actual" type="number" min="0" step="0.5" value="${S.actual}" style="width:120px">`;
  h += '<button id="saveActual">記録する</button></div>';
  if (S.actual !== '' && S.recorded) {
    const diff = Number(S.actual) - exp;
    h += `<table><tr><td>期待した時間</td><td>${exp} 時間</td></tr>` +
      `<tr><td>実際</td><td>${S.actual} 時間</td></tr>` +
      `<tr><td>ずれ</td><td class="${Math.abs(diff) > 1 ? 'diff' : ''}">${diff > 0 ? '+' : ''}${diff} 時間</td></tr></table>`;
    h += '<div class="hint">ずれは、次の依頼で粗さの目安を見直す材料です。</div>';
  }
  return h + '</div>';
}

function labView() {
  const sec = S.selectSec === null ? '（送信すると表示）' : `${S.selectSec} 秒` + (S.selectSec <= 30 ? '（30秒以内）' : '（30秒を超えた）');
  let h = `<div>1. 4項目を選ぶまでの時間：<b>${sec}</b></div>`;
  h += '<div style="margin-top:4px">2. 粗さを変えた記録：</div>';
  h += S.roughLog.length
    ? '<ul style="margin:2px 0 0;padding-left:18px">' + S.roughLog.map(l =>
      `<li>${roleName(l.by)}：${l.from} → ${l.to}</li>`).join('') + '</ul>'
    : '<div>（まだ変更なし。時間つきで見たあと粗さを変えたくなるか試してください）</div>';
  return h;
}

function render() {
  $('roles').innerHTML = ['boss', 'worker'].map(r =>
    `<button data-role="${r}" class="${S.role === r ? 'on' : ''}">${roleName(r)}</button>`).join('');
  $('roleHint').textContent = S.role === 'boss'
    ? '課長として、自分で選んで依頼するか、Bさんからの確認に答えます。'
    : 'Bさんとして、口頭で頼まれた内容をシートに埋めて確認を求めます。';
  $('app').innerHTML = sheetView() + confirmView() + retroView();
  $('lab').innerHTML = labView();
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.role) { S.role = t.dataset.role; render(); }
  else if (t.dataset.k) { pick(t.dataset.k, t.dataset.k === 'rough' ? Number(t.dataset.v) : t.dataset.v); }
  else if (t.dataset.diff) {
    const i = S.diffItems.indexOf(t.dataset.diff);
    if (i >= 0) S.diffItems.splice(i, 1); else S.diffItems.push(t.dataset.diff);
    const note = $('diffNote') ? $('diffNote').value : '';
    render(); if ($('diffNote')) $('diffNote').value = note;
  }
  else if (t.id === 'send') {
    S.selectSec = Math.round((Date.now() - S.startedAt) / 1000);
    S.from = S.role; S.status = 'sent'; S.diffItems = []; render();
  }
  else if (t.id === 'ok') { S.status = 'agreed'; S.diffItems = []; render(); }
  else if (t.id === 'ng') {
    S.diffNote = $('diffNote').value; S.status = 'revise'; render();
  }
  else if (t.id === 'edit') { S.status = 'draft'; S.startedAt = Date.now(); render(); }
  else if (t.id === 'saveActual') { S.actual = $('actual').value; S.recorded = S.actual !== ''; render(); }
  else if (t.id === 'sample') {
    S = Object.assign(initial(), {
      role: 'worker', title: '評価結果のまとめ', audience: '部長', pages: '1〜3枚',
      rough: 1, date: '来週月曜（部長報告）', ref: '先月の部長報告（3枚）',
      startedAt: Date.now() - 22000
    });
    render();
  }
  else if (t.id === 'reset') { S = initial(); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'title') S.title = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'ref') S.ref = e.target.value;
});
render();
</script>
</body>
</html>
