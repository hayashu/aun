<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フィードバックカード（A4xB1-2）</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2933; --sub: #616e7c;
  --line: #d9dee4; --accent: #2f6f8f; --accent-bg: #e3f0f6;
  --good: #2e7d4f; --good-bg: #e4f3ea; --warn-bg: #fff4dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181c; --card: #1e242a; --text: #e6eaee; --sub: #9aa5b1;
    --line: #34404a; --accent: #6bb4d4; --accent-bg: #1f3441;
    --good: #6fcf97; --good-bg: #1d3327; --warn-bg: #3a3220;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); background: var(--card); }
header h1 { margin: 0; font-size: 15px; }
header small { color: var(--sub); }
main { padding: 12px 16px 40px; max-width: 420px; margin: 0 auto; }
.bar { display: flex; gap: 8px; margin-bottom: 12px; }
.bar button { flex: 1; }
button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--text); cursor: pointer; }
button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; margin-bottom: 12px; }
.sec h2 { margin: 0 0 8px; font-size: 14px; }
.sec.good { border-left: 4px solid var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chips button { padding: 5px 10px; font-size: 13px; border-radius: 16px; }
label { display: block; font-size: 12px; color: var(--sub); margin: 6px 0 2px; }
input[type=text] { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); color: var(--text); }
.note { font-size: 12px; color: var(--sub); }
.box { background: var(--warn-bg); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
.reply { background: var(--accent-bg); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; }
.q { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.timer { text-align: right; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
.empty { text-align: center; color: var(--sub); padding: 24px 0; }
</style>
</head>
<body>
<header>
  <h1>試作へのフィードバックカード</h1>
  <small>PRD A4xB1-2 ／ モック（保存されません）</small>
</header>
<main>
  <div class="bar">
    <button id="r-boss">課長として書く</button>
    <button id="r-b">Bさんとして受け取る</button>
  </div>
  <div class="bar"><button id="sample">サンプルを読み込む</button><button id="reset">リセット</button></div>
  <div id="view"></div>
</main>
<script>
var PARTS = ["基板の固定部", "ネジ・固定具", "操作部", "配線", "筐体"];
var GOODS = ["配線がきれいに整理されている", "寸法が正確", "組立手順がメモされている"];
var WHYS = ["作業者が使いにくい", "強度が足りない", "交換に手間がかかる"];
var CHANCES = ["次はこれを任せたい", "次も声をかける"];

var role = "boss";
var card = null;   // 送信済みのカード
var draft = blank();
var startedAt = null;
var elapsed = null;
var feel = {};     // Bさんの確認用の回答（記録されない）

function blank() {
  return { good: "", goodFree: "", where: "", why: "", whyFree: "", next: "", chance: "", q: {} };
}
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function chips(list, field, cur, scope) {
  return '<div class="chips">' + list.map(function (t) {
    var on = cur === t ? " on" : "";
    return '<button class="' + on + '" data-pick="' + field + '" data-v="' + esc(t) + '" data-s="' + scope + '">' + esc(t) + '</button>';
  }).join("") + "</div>";
}

function renderBoss() {
  var h = '<div class="box">このカードを見られるのは、あなたとBさんの2人だけです。試作に点数は付きません。</div>';
  h += '<div class="timer" id="timer">所要時間: ' + (elapsed !== null ? elapsed + "秒（確認用）" : "入力すると計測開始") + "</div>";
  h += '<div class="sec good"><h2>1. よかった点（試作の部分から）</h2>' + chips(GOODS, "good", draft.good, "d");
  h += '<label>または一行で</label><input type="text" id="goodFree" value="' + esc(draft.goodFree) + '"></div>';
  h += '<div class="sec"><h2>2. 直すとよい点</h2><label>どこが</label>' + chips(PARTS, "where", draft.where, "d");
  h += "<label>なぜ</label>" + chips(WHYS, "why", draft.why, "d");
  h += '<label>または一行で</label><input type="text" id="whyFree" value="' + esc(draft.whyFree) + '"></div>';
  h += '<div class="sec"><h2>3. 次はこうするとよい</h2><input type="text" id="next" value="' + esc(draft.next) + '"></div>';
  h += '<div class="sec"><h2>4. 次の機会の一言</h2>' + chips(CHANCES, "chance", draft.chance, "d");
  h += '<div class="note">選ぶと、3か月後に課長へ「声はかけましたか」とお知らせします。</div></div>';
  h += '<button class="primary" id="send">Bさんに送る</button>';
  if (card) h += renderInbox();
  return h;
}

function renderInbox() {
  var keys = Object.keys(card.q);
  var h = '<div class="sec" style="margin-top:12px"><h2>Bさんからの「もう少し聞きたい」</h2>';
  if (!keys.length) return h + '<div class="note">まだありません。</div></div>';
  keys.forEach(function (k) {
    var q = card.q[k];
    h += '<div class="q"><b>' + esc(k) + "</b>：" + esc(q.text || "（コメントなし）");
    if (q.answer) {
      h += '<div class="reply">' + esc(q.answer) + "</div>";
    } else {
      h += '<label>一行で答える</label><input type="text" id="ans-' + esc(k) + '">';
      h += '<div class="chips" style="margin-top:6px"><button data-ans="' + esc(k) + '" data-mode="line">返信する</button>';
      h += '<button data-ans="' + esc(k) + '" data-mode="talk">5分話す時間を提案する</button></div>';
    }
    h += "</div>";
  });
  return h + "</div>";
}

function askBlock(key, body) {
  var q = card.q[key];
  var h = '<div class="sec' + (key === "よかった点" ? " good" : "") + '"><h2>' + key + "</h2><div>" + esc(body) + "</div>";
  if (q) {
    h += '<div class="note">「ここをもう少し聞きたい」を送りました' + (q.text ? "：" + esc(q.text) : "") + "</div>";
    if (q.answer) h += '<div class="reply">課長：' + esc(q.answer) + "</div>";
  } else {
    h += '<div id="ask-' + key + '"><button data-open="' + key + '" style="margin-top:8px">ここをもう少し聞きたい</button></div>';
  }
  return h + "</div>";
}

function renderB() {
  if (!card) return '<div class="empty">課長からのカードはまだ届いていません。<br>「サンプルを読み込む」を試してください。</div>';
  var good = card.good || card.goodFree;
  var why = card.why || card.whyFree;
  var h = askBlock("よかった点", good || "（未記入）");
  h += askBlock("直すとよい点", (card.where || "（部分未選択）") + "が、" + (why || "（理由未記入）"));
  h += askBlock("次はこうするとよい", card.next || "（未記入）");
  if (card.chance) h += '<div class="sec good"><h2>次の機会の一言</h2>課長より：' + esc(card.chance) + "</div>";
  h += '<div class="sec"><h2>モック確認用（記録されません）</h2><label>このカードを読んで「次はこうしよう」と思えましたか</label>';
  h += chips(["思えた", "少し思えた", "思えなかった"], "feel", feel.v, "f");
  h += '<label>「次の機会の一言」は、その気持ちに影響しましたか</label>';
  h += chips(["影響した", "あまり影響しない", "一言は無かった"], "eff", feel.e, "f") + "</div>";
  return h;
}

function render() {
  $("r-boss").className = role === "boss" ? "on" : "";
  $("r-b").className = role === "b" ? "on" : "";
  $("view").innerHTML = role === "boss" ? renderBoss() : renderB();
}
function startTimer() { if (startedAt === null && elapsed === null) startedAt = Date.now(); }

$("r-boss").onclick = function () { role = "boss"; render(); };
$("r-b").onclick = function () { role = "b"; render(); };
$("reset").onclick = function () {
  card = null; draft = blank(); startedAt = null; elapsed = null; feel = {}; render();
};
$("sample").onclick = function () {
  draft = { good: "配線がきれいに整理されている", goodFree: "", where: "基板の固定部",
    why: "作業者が使いにくい", whyFree: "片手で基板を押さえたまま操作できない",
    next: "次は固定のネジを、工具なしで回せる形にしてみよう", chance: "次も声をかける", q: {} };
  card = null; startedAt = null; elapsed = 48; feel = {}; role = "boss"; render();
};

$("view").addEventListener("input", function (e) {
  var id = e.target.id;
  if (id === "goodFree" || id === "whyFree" || id === "next") {
    startTimer();
    draft[id] = e.target.value;
  }
});

$("view").addEventListener("click", function (e) {
  var t = e.target;
  if (t.dataset.pick) {
    var f = t.dataset.pick;
    if (t.dataset.s === "f") {
      feel[f === "feel" ? "v" : "e"] = t.dataset.v;
    } else {
      startTimer();
      draft[f] = draft[f] === t.dataset.v ? "" : t.dataset.v;
    }
    render();
  } else if (t.id === "send") {
    if (startedAt !== null) { elapsed = Math.round((Date.now() - startedAt) / 1000); startedAt = null; }
    card = JSON.parse(JSON.stringify(draft));
    card.q = {};
    role = "b";
    render();
  } else if (t.dataset.open) {
    var k = t.dataset.open;
    $("ask-" + k).innerHTML = '<label>聞きたいこと（任意）</label><input type="text" id="qt-' + k + '">' +
      '<button class="primary" style="margin-top:6px" data-send="' + k + '">送る</button>';
  } else if (t.dataset.send) {
    var key = t.dataset.send;
    card.q[key] = { text: $("qt-" + key).value, answer: "" };
    render();
  } else if (t.dataset.ans) {
    var a = t.dataset.ans;
    var line = $("ans-" + a).value;
    card.q[a].answer = t.dataset.mode === "talk" ? "5分ほど話しましょう。時間を後で連絡します。" : (line || "（返信なし）");
    render();
  }
});
render();
</script>
</body>
</html>
