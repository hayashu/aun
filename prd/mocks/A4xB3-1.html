<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>見積もり癖ノート（A4xB3-1）</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2933; --sub: #66707c;
  --line: #dde1e6; --accent: #2f6fb0; --est: #9fb4c9; --act: #2f6fb0;
  --mark: #d98324; --soft: #fdf1e0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181d; --card: #1e242b; --text: #e6e9ed; --sub: #9aa4b0;
    --line: #333b44; --accent: #6aa5e0; --est: #55697f; --act: #6aa5e0;
    --mark: #f0a24d; --soft: #3a2d1c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { padding: 12px 16px 8px; }
header h1 { font-size: 17px; margin: 0; }
header small { color: var(--sub); }
main { padding: 0 16px 40px; max-width: 420px; margin: 0 auto; }
.bar { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
button, select, input { font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 10px 0; }
.tabs button.on { border-bottom: 3px solid var(--accent); font-weight: bold; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 6px; }
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.row input[type=number] { width: 64px; }
.row input[type=text] { flex: 1; min-width: 0; }
.sub { color: var(--sub); font-size: 13px; }
.hint { background: var(--soft); border-radius: 8px; padding: 4px 8px; font-size: 13px; width: 100%; }
.seg { border-top: 1px solid var(--line); padding: 6px 0; }
.bars { margin: 4px 0; }
.b { height: 12px; border-radius: 6px; margin: 2px 0; min-width: 2px; }
.b.e { background: var(--est); } .b.a { background: var(--act); }
.b.big { background: var(--mark); }
.tag { display: inline-block; font-size: 12px; background: var(--soft); color: var(--text);
  border-radius: 6px; padding: 0 6px; margin-left: 4px; }
.hide { display: none; }
</style>
</head>
<body>
<header>
  <h1>見積もり癖ノート <small>A4xB3-1</small></h1>
  <small>区切りごとの計画と実績を残し、自分の癖を次の見積もりに活かす（本人だけが見られる記録）</small>
</header>
<main>
  <div class="bar">
    <select id="who"><option value="B">Bさん（評価資料）</option><option value="A">Aさん（調査）</option></select>
    <button id="sample">サンプルを読み込む</button>
    <button id="clear">空にする</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="jobs" class="on">仕事</button>
    <button data-t="gap">ずれ</button>
    <button data-t="habit">見積もり癖</button>
  </div>
  <section id="jobs"></section>
  <section id="gap" class="hide"></section>
  <section id="habit" class="hide"></section>
</main>
<script>
const KINDS = ["調べる", "作る・測る", "まとめる", "確認を待つ"];
const REASONS = ["思ったより作業が多かった", "割り込みが入った", "待ちが発生した"];
const S = (k, e, a, r) => ({ kind: k, est: e, act: a, reason: r || "" });
const SAMPLES = {
  B: [
    { name: "評価資料（製品X）", done: true, segs: [S("調べる", 1, 1), S("作る・測る", 3, 3), S("まとめる", 2, 6, REASONS[0]), S("確認を待つ", 1, 2, REASONS[2])] },
    { name: "試験報告（基板Y）", done: true, segs: [S("作る・測る", 4, 4), S("まとめる", 2, 5, REASONS[0])] },
    { name: "部品比較表", done: true, segs: [S("調べる", 2, 3, REASONS[1]), S("まとめる", 1, 3, REASONS[0])] },
  ],
  A: [
    { name: "市場調査（欧州）", done: true, segs: [S("調べる", 3, 3), S("まとめる", 2, 2), S("確認を待つ", 0.5, 3, REASONS[2])] },
    { name: "規格調査（国内）", done: true, segs: [S("調べる", 2, 2), S("まとめる", 1, 1.5, REASONS[0])] },
    { name: "仕様確認（部品Z）", done: true, segs: [S("調べる", 1, 1), S("まとめる", 1, 1)] },
  ],
};
const store = { A: [], B: [] };
let who = "B", tab = "jobs", sel = 0;
const $ = id => document.getElementById(id);
const jobs = () => store[who];
const total = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

function habits() {
  const h = {};
  KINDS.forEach(k => h[k] = { est: 0, act: 0, n: 0 });
  let waitJobs = 0, noWaitSeg = 0;
  jobs().filter(j => j.done).forEach(j => {
    j.segs.forEach(s => { h[s.kind].est += s.est; h[s.kind].act += s.act; h[s.kind].n++; });
    const hasWait = j.segs.some(s => s.kind === "確認を待つ");
    const waited = j.segs.some(s => s.reason === REASONS[2]);
    if (waited) waitJobs++;
    if (waited && !hasWait) noWaitSeg++;
  });
  return { h, waitJobs, noWaitSeg };
}
function ratioOf(x) { return x.est ? x.act / x.est : 0; }

function render() {
  renderJobs(); renderGap(); renderHabit();
  ["jobs", "gap", "habit"].forEach(t => $(t).classList.toggle("hide", t !== tab));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
}

function kindOptions(cur) {
  return KINDS.map(k => `<option ${k === cur ? "selected" : ""}>${k}</option>`).join("");
}
function hintFor(kind) {
  const x = habits().h[kind];
  if (x.n && ratioOf(x) >= 1.3) {
    return `${kind}はこれまで見積もりの平均${ratioOf(x).toFixed(1)}倍かかっています（${x.n}回分）。日数はご自身で決めてください。`;
  }
  return "";
}

function renderJobs() {
  const el = $("jobs");
  let html = `<div class="card"><h2>新しい仕事の見積もり</h2>
    <div class="row"><input type="text" id="nname" placeholder="仕事の名前"></div>`;
  for (let i = 0; i < 5; i++) {
    html += `<div class="row">
      <select class="nk" data-i="${i}">${i < 3 ? "" : "<option value=''>（使わない）</option>"}${kindOptions(KINDS[Math.min(i, 3)])}</select>
      <input type="number" class="ne" data-i="${i}" min="0" step="0.5" placeholder="日数"> 日
      <div class="hint hide" id="nh${i}"></div></div>`;
  }
  html += `<div class="hint hide" id="nwait"></div>
    <div class="row"><button class="primary" id="nadd">この見積もりで始める</button></div>
    <div class="sub">区切りは3〜5個。見積もりは本人用で、上司への報告ではありません。</div></div>`;
  jobs().forEach((j, ji) => { html += jobCard(j, ji); });
  if (!jobs().length) html += `<p class="sub">まだ仕事がありません。「サンプルを読み込む」を押してください。</p>`;
  el.innerHTML = html;
  el.querySelectorAll(".nk").forEach(s => s.onchange = updateHints);
  const add = $("nadd");
  if (add) add.onclick = addJob;
  el.querySelectorAll(".act").forEach(s => s.onchange = () => setActual(+s.dataset.j, +s.dataset.s, s.value));
  el.querySelectorAll(".rsn").forEach(s => s.onchange = () => { jobs()[+s.dataset.j].segs[+s.dataset.s].reason = s.value; });
  el.querySelectorAll(".fin").forEach(b => b.onclick = () => { jobs()[+b.dataset.j].done = true; sel = +b.dataset.j; tab = "gap"; render(); });
  updateHints();
}

function updateHints() {
  const kinds = [];
  document.querySelectorAll(".nk").forEach(s => {
    const i = s.dataset.i, t = hintFor(s.value), h = $("nh" + i);
    if (s.value) kinds.push(s.value);
    if (h) { h.textContent = t; h.classList.toggle("hide", !t); }
  });
  const w = $("nwait"), hb = habits();
  const show = hb.noWaitSeg > 0 && !kinds.includes("確認を待つ");
  if (w) {
    w.textContent = show ? `過去${hb.noWaitSeg}件の仕事で、待ちが発生したのに「確認を待つ」を見積もりに入れていませんでした。今回は必要ですか？` : "";
    w.classList.toggle("hide", !show);
  }
}

function addJob() {
  const name = $("nname").value.trim() || "無題の仕事";
  const segs = [];
  document.querySelectorAll(".nk").forEach(s => {
    const e = parseFloat(document.querySelector(`.ne[data-i="${s.dataset.i}"]`).value);
    if (s.value && e > 0) segs.push({ kind: s.value, est: e, act: null, reason: "" });
  });
  if (segs.length < 3) { alert("区切りを3つ以上、日数つきで入れてください。"); return; }
  jobs().unshift({ name, done: false, segs });
  render();
}

function setActual(j, s, v) {
  jobs()[j].segs[s].act = v === "" ? null : parseFloat(v);
  render();
}

function jobCard(j, ji) {
  let html = `<div class="card"><h2>${j.name}${j.done ? '<span class="tag">完了</span>' : ""}</h2>`;
  j.segs.forEach((s, si) => {
    html += `<div class="seg"><b>${s.kind}</b> <span class="sub">見積もり ${s.est}日</span>`;
    if (j.done) {
      html += ` <span class="sub">／ 実績 ${s.act}日</span>${s.reason ? `<span class="tag">${s.reason}</span>` : ""}`;
    } else {
      const opts = [0.5, 1, 1.5, 2, 3, 4, 5, 6, 8, 10].map(d => `<option ${s.act === d ? "selected" : ""}>${d}</option>`).join("");
      html += `<div class="row">実績
        <select class="act" data-j="${ji}" data-s="${si}"><option value="">未入力</option>${opts}</select> 日`;
      if (s.act !== null && s.act > s.est) {
        html += `<select class="rsn" data-j="${ji}" data-s="${si}"><option value="">理由（任意）</option>` +
          REASONS.map(r => `<option ${s.reason === r ? "selected" : ""}>${r}</option>`).join("") + `</select>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });
  if (!j.done) {
    const ready = j.segs.every(s => s.act !== null);
    html += `<button class="fin primary ${ready ? "" : "hide"}" data-j="${ji}">この仕事を終えて、ずれを見る</button>`;
  }
  return html + `</div>`;
}

function renderGap() {
  const done = jobs().map((j, i) => ({ j, i })).filter(x => x.j.done);
  if (!done.length) { $("gap").innerHTML = `<p class="sub">完了した仕事がまだありません。</p>`; return; }
  if (!done.some(x => x.i === sel)) sel = done[0].i;
  const j = jobs()[sel];
  const max = Math.max(...j.segs.map(s => Math.max(s.est, s.act)));
  let big = 0;
  j.segs.forEach((s, i) => { if (s.act - s.est > j.segs[big].act - j.segs[big].est) big = i; });
  let html = `<select id="gsel">${done.map(x => `<option value="${x.i}" ${x.i === sel ? "selected" : ""}>${x.j.name}</option>`).join("")}</select>
    <div class="card" style="margin-top:12px"><h2>${j.name}：区切りごとの見積もりと実績</h2>
    <div class="sub">上が見積もり、下が実績。いちばん差が大きい区切りは橙色です。</div>`;
  j.segs.forEach((s, i) => {
    const isBig = i === big && s.act > s.est;
    html += `<div class="seg"><b>${s.kind}</b>${isBig ? '<span class="tag">最も差が大きい</span>' : ""}
      <div class="bars"><div class="b e" style="width:${s.est / max * 100}%"></div>
      <div class="b a ${isBig ? "big" : ""}" style="width:${s.act / max * 100}%"></div></div>
      <span class="sub">${s.est}日 → ${s.act}日${s.reason ? "（" + s.reason + "）" : ""}</span></div>`;
  });
  const b = j.segs[big];
  html += b.act > b.est
    ? `<p>この仕事では「${b.kind}」に見積もりより${(b.act - b.est)}日多くかかりました。次の見積もりに使える情報です。</p>`
    : `<p>この仕事は、どの区切りも見積もりの範囲に収まりました。</p>`;
  $("gap").innerHTML = html + `</div>`;
  $("gsel").onchange = e => { sel = +e.target.value; render(); };
}

function renderHabit() {
  const { h, waitJobs, noWaitSeg } = habits();
  const nJobs = jobs().filter(j => j.done).length;
  if (!nJobs) { $("habit").innerHTML = `<p class="sub">完了した仕事の記録がまだありません。</p>`; return; }
  const maxR = Math.max(2, ...KINDS.map(k => ratioOf(h[k])));
  let html = `<div class="card"><h2>区切りの種類ごとの見積もり癖</h2>
    <div class="sub">完了した${nJobs}件の仕事から集計。数が少ないうちは目安です。</div>`;
  KINDS.forEach(k => {
    const x = h[k], r = ratioOf(x);
    if (!x.n) { html += `<div class="seg"><b>${k}</b> <span class="sub">記録なし</span></div>`; return; }
    const cls = r >= 1.3 ? "b a big" : "b a";
    html += `<div class="seg"><b>${k}</b> <span class="sub">${x.n}回分</span>
      <div class="bars"><div class="${cls}" style="width:${r / maxR * 100}%"></div></div>
      <span>見積もりの平均 ${r.toFixed(1)}倍</span></div>`;
  });
  html += `</div><div class="card"><h2>気づきの例</h2>`;
  const slow = KINDS.filter(k => h[k].n && ratioOf(h[k]) >= 1.3);
  slow.forEach(k => { html += `<p>「${k}」は見積もりの平均${ratioOf(h[k]).toFixed(1)}倍かかる傾向があります。</p>`; });
  if (noWaitSeg) html += `<p>待ちが発生した${waitJobs}件のうち${noWaitSeg}件で、「確認を待つ」を見積もりに入れていませんでした。</p>`;
  if (!slow.length && !noWaitSeg) html += `<p>今のところ、目立つ偏りはありません。</p>`;
  html += `<div class="sub">遅れやすい区切りだけを調整するのがおすすめです。全体を一律に増やす必要はありません。</div></div>
    <button id="tonew" class="primary">この癖を見ながら、新しい見積もりを書く</button>`;
  $("habit").innerHTML = html;
  $("tonew").onclick = () => { tab = "jobs"; render(); window.scrollTo(0, 0); };
}

$("tabs").onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };
$("who").onchange = e => { who = e.target.value; sel = 0; render(); };
$("sample").onclick = () => { store[who] = JSON.parse(JSON.stringify(SAMPLES[who])); sel = 0; render(); };
$("clear").onclick = () => { store[who] = []; render(); };
render();
</script>
</body>
</html>
