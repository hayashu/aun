<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習プラン帳（A5xB1-1）</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2933; --sub: #5f6c7b;
  --line: #d9dee5; --accent: #2f6fb0; --accent-bg: #e6f0fa;
  --ok: #2e7d4f; --ok-bg: #e3f3e9; --warn: #a15c00; --warn-bg: #fdf0dc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181d; --card: #1e242b; --text: #e6eaee; --sub: #9aa7b5;
    --line: #333c46; --accent: #6aa8e6; --accent-bg: #1f3347;
    --ok: #6fcf97; --ok-bg: #1c3626; --warn: #f2b45a; --warn-bg: #3a2c14;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 16px; }
header small { color: var(--sub); }
main { padding: 16px; max-width: 480px; margin: 0 auto; }
nav { display: flex; gap: 4px; margin-bottom: 12px; }
nav button { flex: 1; padding: 8px 2px; font-size: 13px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); border-radius: 6px; }
nav button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; margin-bottom: 12px; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.sub { color: var(--sub); font-size: 13px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px;
  background: var(--accent-bg); color: var(--accent); margin-right: 4px; }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
button.main { width: 100%; padding: 10px; border: 0; border-radius: 6px; font-size: 15px;
  background: var(--accent); color: #fff; margin-top: 8px; }
button.ghost { padding: 6px 10px; border: 1px solid var(--line); background: transparent;
  color: var(--text); border-radius: 6px; font-size: 13px; }
textarea, input[type=text] { width: 100%; padding: 8px; font-size: 15px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
label { display: block; font-size: 13px; color: var(--sub); margin-top: 8px; }
.notice { background: var(--warn-bg); color: var(--warn); padding: 8px 12px;
  border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin: 6px 0; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
img.ph { width: 100%; border-radius: 6px; margin-top: 6px; }
.row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
ul { margin: 4px 0; padding-left: 20px; }
</style>
</head>
<body>
<header>
  <h1>練習プラン帳</h1>
  <small>A5xB1-1 ／ 業務につながる小さなものづくりを自分のペースで</small>
</header>
<main>
  <div class="notice">練習は本人の希望で行うもので、業務の評価には関係しません。他の人との比較もありません。</div>
  <nav id="nav"></nav>
  <div id="view"></div>
</main>
<script>
const PLANS = {
  noise: {
    name: "ノイズ対策", use: "試作基板の誤動作の原因切り分け",
    steps: [
      { t: "ノイズを測る", min: 90, use: "試作品の誤動作が出たとき、まず状況を数字で示せる",
        parts: "オシロスコープ、プローブ、5Vの電源", cost: 0, loan: "オシロスコープ（試作室の貸出機）",
        safe: "5V以下の電源だけを使う" },
      { t: "コンデンサで減らす", min: 90, use: "電源回路のバイパスコンデンサの選定",
        parts: "セラミックコンデンサ数種、ブレッドボード", cost: 800, loan: "",
        safe: "コンデンサの極性と耐圧を確認する" },
      { t: "配線で減らす", min: 120, use: "基板のパターン設計のレビュー",
        parts: "ジャンパ線、ツイスト線", cost: 500, loan: "",
        safe: "通電したまま配線を触らない" },
      { t: "筐体で減らす", min: 120, use: "筐体への組み込み時のシールド検討",
        parts: "アルミテープ、小型の筐体", cost: 1500, loan: "ニッパ・テスター（試作室）",
        safe: "金属の切り口で手を切らないよう手袋を使う" }
    ]
  },
  power: {
    name: "電源回路", use: "電源まわりの設計相談",
    steps: [
      { t: "三端子レギュレータで5Vを作る", min: 60, use: "基板上の電源の基本",
        parts: "レギュレータIC、コンデンサ", cost: 600, loan: "テスター（試作室）", safe: "入力は12V以下" },
      { t: "負荷を変えて電圧を測る", min: 90, use: "電源の余裕の見積もり",
        parts: "抵抗数種", cost: 300, loan: "", safe: "抵抗の発熱に注意" },
      { t: "発熱を見る", min: 90, use: "放熱設計の判断",
        parts: "放熱板、温度計", cost: 700, loan: "", safe: "通電後すぐに部品を触らない" }
    ]
  },
  jig: {
    name: "治具づくり", use: "組立ラインの治具の試作",
    steps: [
      { t: "小さな部品を3Dプリンタで出す", min: 60, use: "寸法の目安をつかむ",
        parts: "3Dプリンタ、フィラメント", cost: 0, loan: "3Dプリンタ（試作室）", safe: "出力直後のノズルに触れない" },
      { t: "寸法を測って直す", min: 90, use: "部品に合う治具の調整",
        parts: "ノギス", cost: 1200, loan: "", safe: "" },
      { t: "実際の部品を固定する治具を作る", min: 120, use: "組立作業での位置決め",
        parts: "実物の部品（見本）", cost: 0, loan: "3Dプリンタ（試作室）", safe: "" }
    ]
  }
};
const SAMPLE = {
  tech: "noise", problem: "",
  logs: [
    { key: "noise-0", ok: true, memo: "5V電源のリップルが約80mVと分かった。波形を撮影した。", photo: "", date: "11/03" },
    { key: "noise-1", ok: false, memo: "0.1uFだけでは減らず。容量を変える必要がありそう。", photo: "", date: "11/10" }
  ]
};
let S = { tech: null, tab: 0, logs: [], open: null };
const TABS = ["技術", "課題", "記録", "まとめ"];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function logOf(key) { return S.logs.find(l => l.key === key); }

function renderNav() {
  document.getElementById("nav").innerHTML = TABS.map((n, i) =>
    `<button class="${i === S.tab ? "on" : ""}" onclick="go(${i})">${n}</button>`).join("");
}
function go(i) { S.tab = i; S.open = null; render(); }

function viewTech() {
  const hints = { noise: "試作品がときどき誤動作する", power: "電源の余裕がわからない", jig: "組立の位置決めに時間がかかる" };
  let h = `<div class="card"><h3>身につけたい技術を一つ選ぶ</h3>
    <div class="sub">いまの業務で困っていることから選んでも大丈夫です。</div></div>`;
  for (const k in PLANS) {
    const p = PLANS[k];
    h += `<div class="card"><div class="row"><div><h3>${p.name}</h3>
      <div class="sub">困りごとの例: ${hints[k]}</div>
      <div class="sub">${p.steps.length}段階</div></div>
      <button class="ghost" onclick="pick('${k}')">${S.tech === k ? "選択中" : "選ぶ"}</button></div></div>`;
  }
  return h + `<button class="ghost" onclick="loadSample()">サンプルを読み込む</button>`;
}
function pick(k) { S.tech = k; go(1); }
function loadSample() { S.tech = SAMPLE.tech; S.logs = JSON.parse(JSON.stringify(SAMPLE.logs)); go(1); }

function viewSteps() {
  if (!S.tech) return `<div class="card">先に「技術」を選んでください。</div>`;
  const p = PLANS[S.tech];
  const done = p.steps.filter((s, i) => { const l = logOf(S.tech + "-" + i); return l && l.ok; }).length;
  const total = p.steps.reduce((a, s) => a + s.cost, 0);
  let h = `<div class="card"><h3>${p.name}の練習プラン</h3>
    <div class="sub">1回1〜2時間。費用の目安は全部で約${total}円。</div>
    <div class="bar"><i style="width:${done / p.steps.length * 100}%"></i></div>
    <div class="sub">${done}/${p.steps.length} 完了（自分のペースで）</div></div>`;
  p.steps.forEach((s, i) => {
    const l = logOf(S.tech + "-" + i);
    const st = l ? (l.ok ? `<span class="tag ok">できた</span>` : `<span class="tag warn">うまくいかず</span>`) : "";
    h += `<div class="card"><div class="row"><h3>${"①②③④⑤"[i]} ${s.t}</h3>${st}</div>
      <div><span class="tag">約${s.min}分</span><span class="tag">約${s.cost}円</span>
      ${s.loan ? `<span class="tag ok">社内で借りられる</span>` : ""}</div>
      <div class="sub">業務での場面: ${s.use}</div>
      <ul class="sub"><li>必要なもの: ${s.parts}</li>
      ${s.loan ? `<li>借りられる道具: ${s.loan}</li>` : ""}
      ${s.safe ? `<li>安全上の注意: ${s.safe}</li>` : ""}</ul>
      <button class="ghost" onclick="openLog(${i})">この課題を記録する</button></div>`;
  });
  return h;
}
function openLog(i) { S.tab = 2; S.open = i; render(); }

function viewLog() {
  if (!S.tech) return `<div class="card">先に「技術」を選んでください。</div>`;
  const p = PLANS[S.tech];
  if (S.open === null) {
    return `<div class="card"><h3>記録する課題を選ぶ</h3>` + p.steps.map((s, i) =>
      `<button class="ghost" style="margin:4px 4px 0 0" onclick="S.open=${i};render()">${i + 1}. ${s.t}</button>`).join("") + `</div>`;
  }
  const s = p.steps[S.open], l = logOf(S.tech + "-" + S.open) || { ok: true, memo: "", photo: "" };
  return `<div class="card"><h3>${s.t}</h3>
    <label>結果</label>
    <label style="display:inline;color:var(--text)"><input type="radio" name="r" value="1" ${l.ok ? "checked" : ""}> できた</label>
    <label style="display:inline;color:var(--text)"><input type="radio" name="r" value="0" ${l.ok ? "" : "checked"}> うまくいかなかった（これも記録です）</label>
    <label>一行メモ</label><input type="text" id="memo" value="${esc(l.memo)}" placeholder="例: 波形が約80mVだった">
    <label>写真（この端末の中だけで表示します）</label>
    <input type="file" id="photo" accept="image/*" onchange="preview(this)">
    <div id="pv">${l.photo ? `<img class="ph" src="${l.photo}" alt="記録の写真">` : ""}</div>
    <button class="main" onclick="saveLog()">記録を保存</button></div>`;
}
let tmpPhoto = null;
function preview(el) {
  const f = el.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { tmpPhoto = r.result; document.getElementById("pv").innerHTML = `<img class="ph" src="${tmpPhoto}" alt="記録の写真">`; };
  r.readAsDataURL(f);
}
function saveLog() {
  const key = S.tech + "-" + S.open;
  const old = logOf(key);
  const rec = {
    key, memo: document.getElementById("memo").value,
    ok: document.querySelector("input[name=r]:checked").value === "1",
    photo: tmpPhoto || (old ? old.photo : ""),
    date: new Date().toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" })
  };
  S.logs = S.logs.filter(l => l.key !== key).concat(rec);
  tmpPhoto = null; S.open = null; go(3);
}

function viewSummary() {
  if (!S.logs.length) return `<div class="card">まだ記録がありません。「サンプルを読み込む」か、課題を記録してください。</div>`;
  let h = `<div class="card"><h3>練習のまとめ</h3>
    <div class="sub">業務でのものづくりを提案するときに、練習の成果として示せます。</div></div>`;
  for (const k in PLANS) {
    const ls = S.logs.filter(l => l.key.startsWith(k + "-"));
    if (!ls.length) continue;
    const p = PLANS[k];
    h += `<div class="card"><h3>${p.name}</h3><div class="sub">${ls.length}件の記録</div>`;
    ls.sort((a, b) => a.key.localeCompare(b.key)).forEach(l => {
      const s = p.steps[+l.key.split("-")[1]];
      h += `<div style="margin-top:8px"><span class="tag ${l.ok ? "ok" : "warn"}">${l.ok ? "できた" : "うまくいかず"}</span>
        <b>${s.t}</b> <span class="sub">${l.date}</span>
        <div class="sub">${esc(l.memo)}</div>
        <div class="sub">→ 業務の場面: ${s.use}</div>
        ${l.photo ? `<img class="ph" src="${l.photo}" alt="記録の写真">` : ""}</div>`;
    });
    h += `<button class="ghost" style="margin-top:8px" onclick="copyText('${k}')">提案用の文面を作る</button>
      <div id="out-${k}"></div></div>`;
  }
  return h;
}
function copyText(k) {
  const p = PLANS[k];
  const lines = S.logs.filter(l => l.key.startsWith(k + "-")).map(l => {
    const s = p.steps[+l.key.split("-")[1]];
    return `・${s.t}（${l.ok ? "できた" : "うまくいかず"}）: ${l.memo}`;
  });
  const text = `${p.name}の練習の成果（${p.use}に関連）\n` + lines.join("\n");
  document.getElementById("out-" + k).innerHTML =
    `<textarea rows="6" style="margin-top:8px">${esc(text)}</textarea><div class="sub">内容を確認・編集して、自分で使ってください。自動では送信されません。</div>`;
}

function render() {
  renderNav();
  document.getElementById("view").innerHTML = [viewTech, viewSteps, viewLog, viewSummary][S.tab]();
}
render();
</script>
</body>
</html>
