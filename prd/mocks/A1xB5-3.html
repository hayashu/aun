<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>試作棚と練習用ジャンク機材の貸出 (A1xB5-3)</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2933; --sub: #62707d;
  --line: #d9dee3; --accent: #2b6cb0; --ok: #2f855a; --okbg: #e6f4ec;
  --hold: #b7791f; --holdbg: #fdf3dc; --warn: #c05621;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181c; --card: #1e2429; --text: #e6eaee; --sub: #9aa7b2;
    --line: #333c44; --accent: #63a4e8; --ok: #6fcf97; --okbg: #1c3326;
    --hold: #e6b85c; --holdbg: #3a2f17; --warn: #f0a070;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 -apple-system, "Hiragino Sans", sans-serif; }
header { padding: 12px 16px 8px; border-bottom: 1px solid var(--line); background: var(--card); }
header h1 { margin: 0; font-size: 15px; }
header small { color: var(--sub); }
main { padding: 12px 16px 40px; max-width: 480px; margin: 0 auto; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
button { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.roles button, .tabs button { flex: 1; padding: 6px 4px; font-size: 13px; }
.on { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; }
.card h3 { margin: 0 0 4px; font-size: 15px; }
.sub { color: var(--sub); font-size: 13px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.b-ok { background: var(--okbg); color: var(--ok); }
.b-hold { background: var(--holdbg); color: var(--hold); }
.b-gray { background: var(--line); color: var(--sub); }
input, select, textarea { width: 100%; font: inherit; padding: 8px; margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
label { font-size: 13px; color: var(--sub); }
.note { font-size: 12px; color: var(--sub); border-left: 3px solid var(--line); padding-left: 8px; margin: 8px 0; }
.num { font-size: 28px; font-weight: 700; }
.stat { flex: 1; text-align: center; }
.memo { font-size: 13px; padding: 4px 0; border-top: 1px dashed var(--line); }
.empty { text-align: center; color: var(--warn); padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>「壊してよい」がはっきりした試作棚</h1>
  <small>PRD A1xB5-3 / モック</small>
</header>
<main>
  <div class="row roles" id="roles"></div>
  <div class="row" style="margin-top:8px">
    <button onclick="loadSample()">サンプルを読み込む</button>
    <button onclick="resetAll()">空にする</button>
  </div>
  <div id="view"></div>
</main>
<script>
const ROLES = ["若手（借りる）", "持ち主（登録）", "上長（承認）", "部門長（一覧）"];
const REASONS = ["不具合の再現用", "顧客への返却予定", "認証試験で使用予定", "その他"];
let role = 0, tab = "shelf", ret = null, lastMsg = "";
let items = [], loans = 0, nextId = 1;

function sample() {
  items = [
    { id: 1, name: "旧型評価ボード EV-200", owner: "田中", status: "shelf", approver: "佐藤部長", memos: ["部品の付け替えでパターン剥がれを体験"] },
    { id: 2, name: "試作電源ユニット 第2世代", owner: "鈴木", status: "shelf", approver: "佐藤部長", memos: [] },
    { id: 3, name: "センサ基板 試作品（初号機）", owner: "高橋", status: "shelf", approver: "佐藤部長", memos: ["ヒートガンではんだ外しを練習"] },
    { id: 4, name: "モータドライバ試作品", owner: "品質部門 山本", status: "hold", reason: "不具合の再現用", memos: [] },
    { id: 5, name: "通信モジュール 旧型", owner: "渡辺", status: "pending", memos: [] },
  ];
  loans = 4; nextId = 6;
}
function loadSample() { sample(); lastMsg = "サンプルを読み込みました"; render(); }
function resetAll() { items = []; loans = 0; lastMsg = ""; render(); }
function find(id) { return items.find(i => i.id === id); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function setRole(i) { role = i; ret = null; lastMsg = ""; render(); }
function setTab(t) { tab = t; ret = null; render(); }

function register() {
  const name = document.getElementById("rn").value.trim();
  const owner = document.getElementById("ro").value.trim() || "（持ち主）";
  const safe = document.getElementById("rs").checked;
  if (!name) { lastMsg = "機材名を入れてください"; return render(); }
  if (!safe) { lastMsg = "電源・バッテリー等の安全条件の確認が必要です。危険のあるものは登録できません"; return render(); }
  items.push({ id: nextId++, name, owner, status: "pending", memos: [] });
  lastMsg = "承認待ちとして登録しました。上長が承認すると棚に並びます";
  render();
}
function hold() {
  const name = document.getElementById("hn").value.trim();
  const reason = document.getElementById("hr").value;
  const owner = document.getElementById("ho").value.trim() || "（保管者）";
  if (!name) { lastMsg = "機材名を入れてください"; return render(); }
  items.push({ id: nextId++, name, owner, status: "hold", reason, memos: [] });
  lastMsg = "「保管中」の札を付けました";
  render();
}
function approve(id) { const i = find(id); i.status = "shelf"; i.approver = "佐藤部長"; lastMsg = "承認しました（確認者の名前が残ります）"; render(); }
function toHold(id) { const i = find(id); i.status = "hold"; i.reason = "その他"; lastMsg = "棚には入れず「保管中」にしました"; render(); }
function borrow(id) { find(id).status = "loaned"; loans++; lastMsg = "貸出を記録しました。壊してかまいません"; render(); }
function startReturn(id) { ret = { id, state: "ok" }; render(); }
function setState(s) { ret.state = s; render(); }
function doReturn() {
  const i = find(ret.id);
  const m = document.getElementById("rm").value.trim();
  if (m) i.memos.push(m);
  i.status = ret.state === "used" ? "gone" : "shelf";
  if (ret.state === "broken") i.broken = true;
  lastMsg = "返却を記録しました。どの状態でも問題のない返し方です";
  ret = null; render();
}

function shelfCard(i) {
  const memos = i.memos.map(m => `<div class="memo">試したこと: ${esc(m)}</div>`).join("");
  const state = i.broken ? ' <span class="badge b-gray">壊れた状態で返却済</span>' : "";
  return `<div class="card"><h3>${esc(i.name)}</h3>
    <span class="badge b-ok">壊してよい</span>${state}
    <div class="sub">承認者: ${esc(i.approver)} ／ 持ち主: ${esc(i.owner)}</div>${memos}
    <div style="margin-top:8px"><button class="primary" onclick="borrow(${i.id})">借りる</button></div></div>`;
}
function holdCard(i) {
  return `<div class="card"><h3>${esc(i.name)}</h3>
    <span class="badge b-hold">保管中・触らないでください</span>
    <div class="sub">理由: ${esc(i.reason)} ／ 保管者: ${esc(i.owner)}</div></div>`;
}
function youthView() {
  const shelf = items.filter(i => i.status === "shelf");
  const held = items.filter(i => i.status === "hold");
  const loaned = items.filter(i => i.status === "loaned");
  let h = `<div class="row tabs" style="margin-top:10px">
    <button class="${tab === "shelf" ? "on" : ""}" onclick="setTab('shelf')">試作棚（${shelf.length}）</button>
    <button class="${tab === "hold" ? "on" : ""}" onclick="setTab('hold')">保管中（${held.length}）</button>
    <button class="${tab === "mine" ? "on" : ""}" onclick="setTab('mine')">貸出中（${loaned.length}）</button></div>`;
  if (tab === "shelf") h += shelf.length ? shelf.map(shelfCard).join("") : '<div class="empty">棚が空です。持ち主に登録を呼びかけましょう</div>';
  if (tab === "hold") h += held.map(holdCard).join("") || '<div class="sub">保管中の機材はありません</div>';
  if (tab === "mine") h += loaned.map(i => ret && ret.id === i.id ? returnForm(i) :
    `<div class="card"><h3>${esc(i.name)}</h3><button onclick="startReturn(${i.id})">返却する</button></div>`).join("") || '<div class="sub">貸出中の機材はありません</div>';
  return h;
}
function returnForm(i) {
  const opts = [["ok", "問題なく返す"], ["broken", "壊れた"], ["used", "部品を使い切った"]];
  return `<div class="card"><h3>${esc(i.name)} を返却</h3>
    <div class="row">${opts.map(o => `<button class="${ret.state === o[0] ? "on" : ""}" onclick="setState('${o[0]}')">${o[1]}</button>`).join("")}</div>
    <div class="note">壊れた・使い切ったは、問題のない返し方です。責任は問われません。</div>
    <label>何を試したか（一行・任意）</label>
    <input id="rm" maxlength="60" placeholder="例: コネクタの付け替え">
    <button class="primary" onclick="doReturn()">返却を記録</button></div>`;
}
function ownerView() {
  return `<div class="card"><h3>棚への登録</h3>
    <label>機材名</label><input id="rn" placeholder="例: 旧型評価ボード">
    <label>持ち主</label><input id="ro" placeholder="例: 田中">
    <label><input type="checkbox" id="rs" style="width:auto"> 電源・バッテリー等の安全条件を確認した</label>
    <button class="primary" onclick="register()">承認を依頼</button></div>
    <div class="card"><h3>保管中の札</h3>
    <label>機材名</label><input id="hn">
    <label>理由</label><select id="hr">${REASONS.map(r => `<option>${r}</option>`).join("")}</select>
    <label>保管者</label><input id="ho">
    <button onclick="hold()">札を付ける</button></div>`;
}
function bossView() {
  const p = items.filter(i => i.status === "pending");
  return `<div class="note">承認は「部門として不要」の確認だけです。壊れた結果の責任は問いません。</div>` +
    (p.map(i => `<div class="card"><h3>${esc(i.name)}</h3><div class="sub">持ち主: ${esc(i.owner)}</div>
      <div class="row" style="margin-top:8px"><button class="primary" onclick="approve(${i.id})">壊してよいと承認</button>
      <button onclick="toHold(${i.id})">棚に入れない</button></div></div>`).join("") || '<div class="sub">承認待ちはありません</div>');
}
function headView() {
  const n = items.filter(i => ["shelf", "loaned"].includes(i.status)).length;
  return `<div class="card row"><div class="stat"><div class="num">${n}</div><div class="sub">棚の機材数</div></div>
    <div class="stat"><div class="num">${loans}</div><div class="sub">貸出件数（累計）</div></div></div>` +
    (n === 0 ? '<div class="empty">棚が空です。年度末の片付けに合わせて登録を呼びかけましょう</div>' : "") +
    '<div class="note">個人別の集計はありません。貸出や試したことは評価に使いません。</div>';
}
function render() {
  document.getElementById("roles").innerHTML = ROLES.map((r, i) => `<button class="${i === role ? "on" : ""}" onclick="setRole(${i})">${r}</button>`).join("");
  const v = [youthView, ownerView, bossView, headView][role]();
  document.getElementById("view").innerHTML = (lastMsg ? `<div class="note">${esc(lastMsg)}</div>` : "") + v;
}
render();
</script>
</body>
</html>
