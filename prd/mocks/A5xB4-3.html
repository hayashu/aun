<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A5xB4-3 分野横断の入門会 モック</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #1d2330; --sub: #5d6676;
  --line: #dfe3ea; --accent: #2f6fdb; --accent-bg: #e6eefc; --ok: #1f8a4c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --card: #1e232c; --text: #e8ebf1; --sub: #9aa3b2;
    --line: #333a47; --accent: #6b9cf2; --accent-bg: #223253; --ok: #5cc88a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
.wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 40px; }
header { padding: 12px 0 8px; }
header h1 { font-size: 14px; margin: 0; line-height: 1.4; }
header small { color: var(--sub); font-size: 11px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button {
  font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
}
button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .4; }
.tabs { display: flex; gap: 4px; margin: 12px 0; }
.tabs button { flex: 1; padding: 8px 4px; }
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px; margin-bottom: 10px;
}
.card h3 { margin: 0 0 4px; font-size: 15px; }
.sub { color: var(--sub); font-size: 12px; }
.tag { font-size: 11px; background: var(--accent-bg); color: var(--accent); border-radius: 4px; padding: 1px 6px; }
.done { color: var(--ok); }
ol { margin: 6px 0 0; padding-left: 22px; }
li { margin-bottom: 4px; }
input[type=text] {
  width: 100%; font: inherit; padding: 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
.item { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.item span { flex: 1; min-width: 0; word-break: break-word; }
.empty { text-align: center; color: var(--sub); padding: 24px 0; }
.note { font-size: 12px; color: var(--sub); margin: 4px 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>各分野が「他分野の人に知ってほしい10のこと」を月1回15分で話す入門会</h1>
    <small>A5xB4-3 / モック（ダミーデータ）</small>
  </header>
  <div class="row">
    <button id="roleP" class="on">参加者（Bさん・電気）</button>
    <button id="roleH">担当者（機械・Cさん）</button>
    <button id="load" class="primary">サンプルを読み込む</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
const SAMPLE = {
  sessions: [
    { id: 1, month: "11月", field: "生産技術", date: "11/20（木）16:00-16:30", state: "done", interest: 6,
      items: ["段取り替えは「止まる時間」の勝負", "タクトタイムとサイクルタイムは別物", "治具は図面に書かれない設計", "公差は積み上げて考える", "量産試作で初めて見える不具合がある",
        "検査工程も設計の一部", "ライン停止1分のコストは大きい", "不良は「流出」と「発生」を分けて見る", "現場に行けば半分わかる", "標準作業書は更新されるもの"] },
    { id: 2, month: "12月", field: "機械", date: "12/18（木）16:00-16:30", state: "next", interest: 4, owner: "Cさん", items: [] },
    { id: 3, month: "1月", field: "電気", date: "1/22（木）16:00-16:30", state: "plan", interest: 2, items: [] },
    { id: 4, month: "2月", field: "ソフト", date: "2/19（木）16:00-16:30", state: "plan", interest: 1, items: [] }
  ],
  wishes: [
    { id: 1, text: "ボスの肉厚って何を気にしているの？", votes: 5, mine: false, adopted: false },
    { id: 2, text: "ドラフト角はなぜ必要？", votes: 4, mine: false, adopted: false },
    { id: 3, text: "公差の表記の読み方", votes: 3, mine: false, adopted: false },
    { id: 4, text: "材料の選び方の基本（樹脂と金属）", votes: 3, mine: false, adopted: false },
    { id: 5, text: "放熱を機械側はどう考えている？", votes: 2, mine: false, adopted: false },
    { id: 6, text: "ねじの締結で気をつけること", votes: 1, mine: false, adopted: false }
  ],
  draft: ["金型から抜けるために、側面には傾き（ドラフト角）が要る", "ボスの肉厚が厚いと、ヒケ（へこみ）が出る"]
};

let S = { sessions: [], wishes: [], draft: [] };
let role = "P";
let tab = "sched";
let openId = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tabsForRole() {
  const base = [["sched", "担当分野の予定"], ["list", "10のことの一覧"]];
  return role === "H" ? [["prep", "10のことの準備"]].concat(base) : base.concat([["ask", "知りたいことを送る"]]);
}

function renderTabs() {
  const list = tabsForRole();
  if (!list.some((t) => t[0] === tab)) tab = list[0][0];
  $("tabs").innerHTML = list.map((t) =>
    `<button data-tab="${t[0]}" class="${t[0] === tab ? "on" : ""}">${t[1]}</button>`).join("");
}

function viewSched() {
  if (!S.sessions.length) return `<div class="empty">予定がありません。「サンプルを読み込む」を押してください。</div>`;
  return S.sessions.map((s) => {
    const done = s.state === "done";
    const body = done ? `<span class="done">実施済み・10のこと掲載あり</span>`
      : `<span class="sub">担当：${s.owner || "調整中"}</span>`;
    const btn = done ? "" : `<button data-int="${s.id}" class="${s.mine ? "on" : ""}">${s.mine ? "参加してみたい（選択中）" : "参加してみたい"}</button>`;
    return `<div class="card"><h3>${s.month}｜${s.field}の回 <span class="tag">${done ? "終了" : "オンライン可"}</span></h3>
      <div class="sub">${s.date}（話す15分＋質問15分）</div><div>${body}</div>
      <div class="row" style="margin-top:8px">${btn}
      <span class="sub">${s.interest}人が関心あり</span>
      <button data-peek="${s.id}">10のことを見る</button></div></div>`;
  }).join("") + `<p class="note">参加は自由です。関心の表明は人数のみ表示し、個人名は出ません。</p>`;
}

function viewList() {
  const shown = S.sessions.filter((s) => s.items.length);
  const pending = S.sessions.filter((s) => !s.items.length && s.state !== "done");
  if (!S.sessions.length) return `<div class="empty">一覧がありません。</div>`;
  let html = shown.map((s) => `<div class="card" ${openId === s.id ? 'style="border-color:var(--accent)"' : ""}>
    <h3>${s.field}の人から他分野の人へ：10のこと</h3><div class="sub">${s.month}の回</div>
    <ol>${s.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ol></div>`).join("");
  html += pending.map((s) => `<div class="card"><h3>${s.field}（${s.month}）</h3>
    <div class="sub">${s.id === 2 && S.draft.length ? "準備中（" + S.draft.length + "/10）。担当者の公開前です。" : "まだ準備されていません。"}</div></div>`).join("");
  return html;
}

function viewAsk() {
  const target = S.sessions.find((s) => s.state === "next");
  if (!target) return `<div class="empty">読み込み後に使えます。</div>`;
  const mine = S.wishes.filter((w) => w.mine);
  return `<div class="card"><h3>${target.field}の回に「これを知りたい」</h3>
    <div class="note">担当者が10のことを選ぶ参考になります。回答の義務はありません。</div>
    <input type="text" id="wishIn" placeholder="例：公差の読み方">
    <div class="row" style="margin-top:8px"><button class="primary" id="wishAdd">送る</button></div></div>
    <div class="card"><h3>みんなの「知りたい」</h3>
    ${S.wishes.map((w) => `<div class="item"><span>${esc(w.text)}</span>
      <button data-vote="${w.id}" class="${w.mine ? "on" : ""}">${w.mine ? "+1済 " : "+1 "}${w.votes}</button></div>`).join("") || '<div class="sub">まだありません。</div>'}
    </div><div class="sub">あなたの+1：${mine.length}件</div>`;
}

function viewPrep() {
  const target = S.sessions.find((s) => s.state === "next");
  if (!target) return `<div class="empty">読み込み後に使えます。</div>`;
  const full = S.draft.length >= 10;
  return `<div class="card"><h3>10のことの準備（${target.field}・${target.month}）</h3>
    <div class="sub">一行ずつでOK。スライドは不要です。 ${S.draft.length}/10</div>
    <div style="margin-top:8px">${S.draft.map((d, i) => `<div class="item"><span>${i + 1}. ${esc(d)}</span>
      <button data-del="${i}">削除</button></div>`).join("") || '<div class="sub">まだ書かれていません。</div>'}</div>
    <input type="text" id="itemIn" placeholder="${full ? "10個そろいました" : "10のことを一行で書く"}" ${full ? "disabled" : ""}>
    <div class="row" style="margin-top:8px"><button class="primary" id="itemAdd" ${full ? "disabled" : ""}>追加</button>
    <button id="publish" ${S.draft.length ? "" : "disabled"}>一覧に公開する</button></div></div>
    <div class="card"><h3>他分野の人の「これを知りたい」</h3>
    <div class="note">参考表示です。票が多い順に自動で採用はされません。採用するかは担当者が決めます。</div>
    ${S.wishes.map((w) => `<div class="item"><span>${esc(w.text)} <span class="tag">${w.votes}票</span></span>
      <button data-adopt="${w.id}" ${w.adopted || full ? "disabled" : ""}>${w.adopted ? "採用済" : "10のことに入れる"}</button></div>`).join("") || '<div class="sub">まだありません。</div>'}
    </div>`;
}

function render() {
  renderTabs();
  const v = { sched: viewSched, list: viewList, ask: viewAsk, prep: viewPrep }[tab];
  $("view").innerHTML = v();
  $("roleP").className = role === "P" ? "on" : "";
  $("roleH").className = role === "H" ? "on" : "";
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const d = b.dataset;
  if (d.tab) tab = d.tab;
  if (d.int) {
    const s = S.sessions.find((x) => x.id == d.int);
    s.mine = !s.mine;
    s.interest += s.mine ? 1 : -1;
  }
  if (d.peek) { openId = +d.peek; tab = "list"; }
  if (d.vote) {
    const w = S.wishes.find((x) => x.id == d.vote);
    w.mine = !w.mine;
    w.votes += w.mine ? 1 : -1;
  }
  if (d.del) S.draft.splice(+d.del, 1);
  if (d.adopt) {
    const w = S.wishes.find((x) => x.id == d.adopt);
    w.adopted = true;
    S.draft.push(w.text + "（要説明）");
  }
  if (b.id === "wishAdd") {
    const t = $("wishIn").value.trim();
    if (t) S.wishes.push({ id: Date.now(), text: t, votes: 1, mine: true, adopted: false });
  }
  if (b.id === "itemAdd") {
    const t = $("itemIn").value.trim();
    if (t && S.draft.length < 10) S.draft.push(t);
  }
  if (b.id === "publish") {
    const s = S.sessions.find((x) => x.state === "next");
    s.items = S.draft.slice();
    openId = s.id;
    tab = "list";
  }
  if (b.id === "roleP") role = "P";
  if (b.id === "roleH") role = "H";
  if (b.id === "load") { S = JSON.parse(JSON.stringify(SAMPLE)); }
  render();
});
render();
</script>
</body>
</html>
