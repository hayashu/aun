<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受け渡し取り決め表 (A2xB4-3)</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #1d2330; --sub: #5b6577; --line: #d9dde5;
  --accent: #2b5fd9; --warn: #b4540a; --warn-bg: #fff1e0; --ok: #1f7a4d; --ok-bg: #e3f5ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --card: #1e232c; --text: #e8ebf1; --sub: #9aa4b5; --line: #343b48;
    --accent: #7ba2ff; --warn: #ffb066; --warn-bg: #3a2a18; --ok: #6fd6a0; --ok-bg: #1b3326;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 sans-serif; }
header { padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; }
header small { color: var(--sub); }
main { padding: 12px 16px 40px; max-width: 420px; margin: 0 auto; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
button, select, input {
  font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%;
}
button { cursor: pointer; }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
.card.flag { border-color: var(--warn); }
.card h3 { margin: 0 0 4px; font-size: 14px; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.grid { display: grid; grid-template-columns: 5.5em 1fr; gap: 4px 8px; align-items: center; }
.grid label, .note { color: var(--sub); font-size: 12px; }
.grid select, .grid input { width: 100%; }
.timer { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>プロジェクト開始時の受け渡し取り決め表</h1>
  <small>A2xB4-3 / 製造業A社 電気・機械プロジェクト</small>
</header>
<main>
  <div class="row" id="roles"></div>
  <div class="row" id="tabs"></div>
  <div id="view"></div>
</main>
<script>
const FORMATS = ['3D', '図面', 'PDF', 'チャット'];
const PROCS = ['依頼書を出す', 'チャットで相談', '調整役を経由', '直接渡す'];
const CONFS = ['受け手が「受け取った」を返す', '受け手が「対応を始めた」を返す', '確認なし'];
const FIELDS = ['電気', '機械', '調整役'];
const ROLES = [
  { id: 'A', name: 'Aさん(調整役)', field: '調整役' },
  { id: 'B', name: 'Bさん(電気)', field: '電気' },
  { id: 'M', name: '機械担当', field: '機械' }
];

const SAMPLE = [
  { name: '基板の外形データ', from: '電気', to: '機械', fmt: '', proc: '', conf: '',
    pref: { 電気: ['PDF', '直接渡す'], 機械: ['3D', '調整役を経由'] }, reason: '' },
  { name: '筐体の寸法', from: '機械', to: '電気', fmt: '図面', proc: '直接渡す', conf: '受け手が「受け取った」を返す',
    pref: { 電気: ['図面', '直接渡す'], 機械: ['図面', '直接渡す'] }, reason: '' },
  { name: '部品の発熱量', from: '電気', to: '機械', fmt: 'PDF', proc: '直接渡す', conf: '受け手が「受け取った」を返す',
    pref: { 電気: ['PDF', '直接渡す'], 機械: ['PDF', '直接渡す'] }, reason: '' },
  { name: '変更の依頼(コネクタ位置と穴)', from: '電気', to: '機械', fmt: '', proc: '', conf: '',
    pref: { 電気: ['チャット', 'チャットで相談'], 機械: ['図面', '依頼書を出す'] }, reason: '' }
];

let state = { role: 'A', tab: 'table', items: [], log: [], onlyDiff: false, left: 1800, timer: null, running: false, saved: false };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isDiff = it => it.pref.電気.join() !== it.pref.機械.join();
const isFilled = it => it.fmt && it.proc && it.conf;
const needsTalk = it => isDiff(it) && !it.reason.trim();

function loadSample() {
  state.items = JSON.parse(JSON.stringify(SAMPLE));
  state.log = [];
  render();
}

function addItem() {
  const name = prompt('受け渡すものの名前');
  if (!name) return;
  state.items.push({ name, from: '電気', to: '機械', fmt: '', proc: '', conf: '',
    pref: { 電気: ['', ''], 機械: ['', ''] }, reason: '' });
  render();
}

function useLast() {
  const marked = state.items.filter(i => i.mark === 'keep');
  if (!state.saved) { alert('先に「引き継ぎ」タブで保存してください'); return; }
  state.items.forEach(i => { if (i.mark === 'keep') i.fromLast = true; });
  alert('保存済みの取り決めを下敷きにしました(うまくいった ' + marked.length + ' 件)');
  render();
}

function toggleTimer() {
  if (state.running) { clearInterval(state.timer); state.running = false; }
  else {
    state.running = true;
    state.timer = setInterval(() => { state.left = Math.max(0, state.left - 1); tick(); }, 1000);
  }
  render();
}

function fmtTime(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tick() { const t = document.getElementById('time'); if (t) t.textContent = fmtTime(state.left); }

function setField(i, key, val) { state.items[i][key] = val; render(); }

function opts(list, cur) {
  return '<option value="">選んでください</option>' +
    list.map(o => `<option${o === cur ? ' selected' : ''}>${esc(o)}</option>`).join('');
}

function itemCard(it, i) {
  const diff = isDiff(it);
  const badge = diff
    ? (needsTalk(it) ? '<span class="badge warn">作法が違う・要相談</span>' : '<span class="badge ok">話し合って決定</span>')
    : '<span class="badge ok">作法は同じ</span>';
  const prefs = diff ? `<div class="note">電気の作法: ${esc(it.pref.電気.join(' / '))}<br>機械の作法: ${esc(it.pref.機械.join(' / '))}</div>` : '';
  const reason = diff
    ? `<label>決めた理由</label><input value="${esc(it.reason)}" placeholder="一行で残す" onchange="setField(${i},'reason',this.value)">` : '';
  return `<div class="card${needsTalk(it) ? ' flag' : ''}">
    <h3>${esc(it.name)} ${badge}${it.fromLast ? ' <span class="badge ok">前回を下敷き</span>' : ''}</h3>
    <div class="note">${esc(it.from)} → ${esc(it.to)}</div>${prefs}
    <div class="grid">
      <label>形式</label><select onchange="setField(${i},'fmt',this.value)">${opts(FORMATS, it.fmt)}</select>
      <label>手順</label><select onchange="setField(${i},'proc',this.value)">${opts(PROCS, it.proc)}</select>
      <label>確認方法</label><select onchange="setField(${i},'conf',this.value)">${opts(CONFS, it.conf)}</select>
      ${reason}
    </div></div>`;
}

function viewTable() {
  const filled = state.items.filter(isFilled).length;
  const talk = state.items.filter(needsTalk).length;
  const pct = state.items.length ? Math.round(filled / state.items.length * 100) : 0;
  const list = state.items.map((it, i) => ({ it, i })).filter(x => !state.onlyDiff || isDiff(x.it));
  return `<div class="card">
      <div class="note">キックオフの持ち時間(30分)</div>
      <div class="timer" id="time">${fmtTime(state.left)}</div>
      <div class="row"><button onclick="toggleTimer()">${state.running ? '止める' : '開始'}</button>
      <button onclick="state.left=1800;render()">戻す</button></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="note">記入済み ${filled}/${state.items.length} 件 ・ 要相談 ${talk} 件</div>
      ${state.items.length && filled === state.items.length && talk === 0 ? `<span class="badge ok">全項目が埋まりました(残り ${fmtTime(state.left)})</span>` : ''}
    </div>
    <div class="row">
      <button onclick="loadSample()">サンプルを読み込む</button>
      <button onclick="addItem()">受け渡しを追加</button>
      <button onclick="useLast()">前のプロジェクトを下敷きに</button>
      <button class="${state.onlyDiff ? 'on' : ''}" onclick="state.onlyDiff=!state.onlyDiff;render()">話し合う項目だけ</button>
    </div>
    ${list.length ? list.map(x => itemCard(x.it, x.i)).join('') : '<p class="note">「サンプルを読み込む」を押してください。</p>'}`;
}

function viewHandoff() {
  const me = ROLES.find(r => r.id === state.role).field;
  const mine = state.items.map((it, i) => ({ it, i })).filter(x => x.it.from === me || me === '調整役');
  if (!state.items.length) return '<p class="note">先に取り決め表を作ってください。</p>';
  return `<p class="note">取り決めに沿って渡します。渡す前に、決まった形を確認してください。</p>` +
    mine.map(({ it, i }) => `<div class="card"><h3>${esc(it.name)}</h3>
      <div class="note">${esc(it.from)} → ${esc(it.to)}</div>
      ${isFilled(it)
        ? `<div>形式: <b>${esc(it.fmt)}</b> ／ 手順: <b>${esc(it.proc)}</b><br>確認: ${esc(it.conf)}</div>
           <div class="row"><button onclick="send(${i})">この形で渡した</button></div>`
        : '<div class="badge warn">取り決めが未記入です</div>'}</div>`).join('');
}

function send(i) {
  state.log.push({ item: i, status: '渡した' });
  state.tab = 'confirm';
  render();
}

function viewConfirm() {
  const me = ROLES.find(r => r.id === state.role).field;
  if (!state.log.length) return '<p class="note">まだ受け渡しはありません。</p>';
  return state.log.map((l, n) => {
    const it = state.items[l.item];
    const canAct = it.to === me && l.status === '渡した';
    const canStart = it.to === me && l.status === '受け取った';
    return `<div class="card"><h3>${esc(it.name)} <span class="badge ${l.status === '渡した' ? 'warn' : 'ok'}">${esc(l.status)}</span></h3>
      <div class="note">${esc(it.from)} → ${esc(it.to)} ／ ${esc(it.fmt)}・${esc(it.proc)}</div>
      <div class="row">
        ${canAct ? `<button onclick="ack(${n},'受け取った')">受け取った</button>` : ''}
        ${canStart ? `<button onclick="ack(${n},'対応を始めた')">対応を始めた</button>` : ''}
        ${!canAct && !canStart ? `<span class="note">${l.status === '渡した' ? esc(it.to) + 'の返事待ち' : ''}</span>` : ''}
      </div>
      <div class="note">「了解」ではなく、状態で返します。</div></div>`;
  }).join('');
}

function ack(n, s) { state.log[n].status = s; render(); }

function viewCarry() {
  if (!state.items.length) return '<p class="note">先に取り決め表を作ってください。</p>';
  return `<p class="note">プロジェクト終了後に、取り決めごとに印を付けて保存します。</p>` +
    state.items.map((it, i) => `<div class="card"><h3>${esc(it.name)}</h3>
      <div class="note">${esc(it.fmt || '未記入')}・${esc(it.proc || '未記入')}</div>
      <div class="row">
        <button class="${it.mark === 'keep' ? 'on' : ''}" onclick="mark(${i},'keep')">うまくいった</button>
        <button class="${it.mark === 'change' ? 'on' : ''}" onclick="mark(${i},'change')">変えたほうがよい</button>
      </div></div>`).join('') +
    `<div class="row"><button onclick="state.saved=true;render()">次のプロジェクト用に保存</button>
     ${state.saved ? '<span class="badge ok">保存しました</span>' : ''}</div>`;
}

function mark(i, m) { state.items[i].mark = m; render(); }

function render() {
  document.getElementById('roles').innerHTML = ROLES.map(r =>
    `<button class="${r.id === state.role ? 'on' : ''}" onclick="state.role='${r.id}';render()">${r.name}</button>`).join('');
  const tabs = [['table', '取り決め表'], ['handoff', '渡す'], ['confirm', '受け取り確認'], ['carry', '引き継ぎ']];
  document.getElementById('tabs').innerHTML = tabs.map(t =>
    `<button class="${t[0] === state.tab ? 'on' : ''}" onclick="state.tab='${t[0]}';render()">${t[1]}</button>`).join('');
  const views = { table: viewTable, handoff: viewHandoff, confirm: viewConfirm, carry: viewCarry };
  document.getElementById('view').innerHTML = views[state.tab]();
}
render();
</script>
</body>
</html>
